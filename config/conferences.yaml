# ============================================================
# 会议系列与已排期实例
# ------------------------------------------------------------
# 国内会议的现实：日期公布得很晚。所以这里分两层：
#
#   series   —— 你每年都关注的"系列"，记录周期与历史月份，
#               用于生成"预计 5 月，日期未公布"的软提醒
#   instances —— 已经发出正式通知的"具体届次"，有确切日期与地点
#
# 程序行为：
#   1. 对 instances 里有确切日期的条目，做 D-30 / D-7 / D-0 倒计时
#   2. 对 series 里没有未来实例的，按 historical_months 推断，
#      在"预计月份"前 60 天提示"该系列通常此时开会，去官网看通知"
#   3. indico 字段给了 URL 的，会去拉 contributions（报告列表）
#
# 维护成本：每年 4-5 次，看到通知就填 instances。
# ============================================================

