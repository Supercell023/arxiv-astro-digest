# 兜底领域包
#
# 当一篇论文的分类不属于任何已勾选的领域包时，用这一套。
# capability: low 的作用是：邮件里会标注"该条为通用判断"，
# 避免模型在没有领域知识时假装权威。

id: generic
name: 综合
capability: low

# 空列表 = 匹配任何未归类的 astro-ph / physics 论文
arxiv_categories: []

evaluation:
  focus:
    - 结论是否有数据支撑，还是主要靠论证与假设
    - 方法是否说清楚到可以复现
    - 误差来源是否交代
  red_flags:
    - 摘要里只有定性描述、没有任何数字
    - 声称"首次"但未说明与既有工作的差别

title_hint: >-
  无特定关键词。按"能否回答读者的五个问题"判断，而不是按主题判断。

reader_context: >-
  读者是星系宇宙学方向的博士生，对非本领域的方法细节只能做常识判断。

sources: {}
