# ============================================================
# 领域事件日历（确定性事件）
# ------------------------------------------------------------
# 这个文件的定位：记录"提前就知道"的大事，而不是靠抓取发现。
# 数据发布、提案截止、会议召开、望远镜发射——这些日期是提前几个月到
# 几年定好的。每天的任务只是：
#   1. 倒计时（还有 N 天）
#   2. 当天/临近提醒（D-0、D-7、D-30 三档）
#   3. 过期归档（-30 天以后不再显示，但保留在文件里做历史）
#
# confidence 三档，决定邮件里的措辞：
#   确定 → "11 月 12 日"        （官方已公告）
#   预计 → "预计 2027 年中"      （有官方路线图但未锁死）
#   待定 → "日期未公布"          （只知道大概窗口）
#
# 维护成本：每年更新一次。改完记得把 updated 字段改掉。
# ============================================================

