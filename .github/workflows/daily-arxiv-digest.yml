name: Daily arXiv Digest

# ── 触发方式 ────────────────────────────────────────────────
# cron 用的是 UTC。
#   30 5 * * *  = 13:30 北京 = 01:30 美东
# arXiv 每天 20:00 ET 发当日公告，这个点拿到的是"昨天的公告 + 今天凌晨前的新提交"，
# 不会踩空。别改成 0:37 UTC —— 那是 19:37 ET，冬令时比公告早 23 分钟，会整天空跑。
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: # Actions 页面可以手动点一次

# 回写 state.json 需要写权限；同时避免仓库 60 天无活动被 GitHub 停掉定时任务
permissions:
  contents: write

# 防止手动触发与定时任务撞车（两次同时跑会重复发信）
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  # 先跑 22 项离线自检：不联网、不花钱。挂了就不发信。
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline self-check
        run: python -m arxiv_digest.selfcheck

  send-digest:
    needs: selfcheck
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          # ── 必需：在 Settings → Secrets and variables → Actions → Secrets ──
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # ── 可选：同上页面 → Variables。留空即用代码里的默认值 ──
          # 模型端点
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # 内容
          FIELDS: ${{ vars.FIELDS }}
          DEEP_PAPERS: ${{ vars.DEEP_PAPERS }}
          BRIEF_PAPERS: ${{ vars.BRIEF_PAPERS }}
          ANALYSIS_ENABLED: ${{ vars.ANALYSIS_ENABLED }}
          ANALYSIS_EXTRACT_MODEL: ${{ vars.ANALYSIS_EXTRACT_MODEL }}
          ANALYSIS_ASSESS_MODEL: ${{ vars.ANALYSIS_ASSESS_MODEL }}
          FULLTEXT_ENABLED: ${{ vars.FULLTEXT_ENABLED }}
          # 板块开关
          PULSE_ENABLED: ${{ vars.PULSE_ENABLED }}
          RADAR_ENABLED: ${{ vars.RADAR_ENABLED }}
          CALENDAR_ENABLED: ${{ vars.CALENDAR_ENABLED }}
          TRANSLATE_ENABLED: ${{ vars.TRANSLATE_ENABLED }}
          # 样式
          EMAIL_THEME: ${{ vars.EMAIL_THEME }}
          EMAIL_ATTACH_HTML: ${{ vars.EMAIL_ATTACH_HTML }}
          # 时区
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
        run: python -m arxiv_digest.main

      # 把 state.json 提交回来：跨天去重靠它；顺便让仓库保持活动，定时任务不会被停
      - name: Persist state
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "没有 state.json，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json 没有变化"
            exit 0
          fi
          git commit -m "chore: update digest state $(date -u +%F)"
          git push
