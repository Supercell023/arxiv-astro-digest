name: Daily arXiv Digest

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES }}
          ARXIV_KEYWORDS: ${{ vars.ARXIV_KEYWORDS }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
          ARXIV_FETCH_MAX_RESULTS: ${{ vars.ARXIV_FETCH_MAX_RESULTS }}
          ARXIV_PAGE_SIZE: ${{ vars.ARXIV_PAGE_SIZE }}
          ARXIV_MAX_PAGES: ${{ vars.ARXIV_MAX_PAGES }}
          ARXIV_PAGE_DELAY_SECONDS: ${{ vars.ARXIV_PAGE_DELAY_SECONDS }}
          ARXIV_REQUEST_TIMEOUT: ${{ vars.ARXIV_REQUEST_TIMEOUT }}
          ARXIV_REQUEST_RETRIES: ${{ vars.ARXIV_REQUEST_RETRIES }}
          ARXIV_RATE_LIMIT_BACKOFF_BASE: ${{ vars.ARXIV_RATE_LIMIT_BACKOFF_BASE }}
          ARXIV_RATE_LIMIT_BACKOFF_MAX: ${{ vars.ARXIV_RATE_LIMIT_BACKOFF_MAX }}
          ARXIV_RATE_LIMIT_BACKOFF_JITTER: ${{ vars.ARXIV_RATE_LIMIT_BACKOFF_JITTER }}
          ARXIV_RATE_LIMIT_GRACEFUL: ${{ vars.ARXIV_RATE_LIMIT_GRACEFUL }}
          MAX_PAPERS: ${{ vars.MAX_PAPERS }}
          MAX_LLM_PAPERS: ${{ vars.MAX_LLM_PAPERS }}
          MAX_ABSTRACT_CHARS: ${{ vars.MAX_ABSTRACT_CHARS }}
          MIN_RATING: ${{ vars.MIN_RATING }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE }}
          ZOTERO_COLLECTION_ID: ${{ vars.ZOTERO_COLLECTION_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m arxiv_digest.main
