<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
</head>
<body style="margin: 0; padding: 0; background: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background: #f4f6f9; padding: 24px 0;">
<tr>
<td align="center">

  <table width="600" cellpadding="0" cellspacing="0" style="background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">

    <tr>
      <td style="background: #c0392b; padding: 32px 40px;">
        <span style="font-size: 26px; font-weight: 700; color: #ffffff;">Daily arXiv Digest</span>
        <br>
        <span style="font-size: 13px; color: rgba(255,255,255,0.7);">运行失败</span>
      </td>
    </tr>

    <tr>
      <td style="padding: 28px 40px;">
        <table width="100%" cellpadding="0" cellspacing="0" style="background: #fff1f0; border: 1px solid #ffccc7; border-radius: 8px;">
        <tr>
          <td style="padding: 18px 20px; font-size: 13px; color: #1a1a2e; line-height: 1.7;">
            <strong style="color: #c0392b;">错误信息</strong><br><br>
            <pre style="white-space: pre-wrap; font-size: 12px; color: #657786; margin: 0;">{{ error_message }}</pre>
          </td>
        </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td style="padding: 0 40px 28px; font-size: 13px; color: #657786; line-height: 1.7;">
        这通常是 arXiv、LLM API 或 SMTP 的临时问题。前往 <a href="https://github.com/Supercell023/arxiv-astro-digest/actions" style="color: #e67e22;">GitHub Actions</a> 查看完整日志。
      </td>
    </tr>

    <tr>
      <td style="background: #f8f9fb; padding: 20px 40px; border-top: 1px solid #e8ecf1; font-size: 11px; color: #aab8c2;">
        {{ generated_at }}
      </td>
    </tr>

  </table>

</td>
</tr>
</table>

</body>
</html>
