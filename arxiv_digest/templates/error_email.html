<!DOCTYPE html>
<html lang="zh-CN">
<body style="font-family: Georgia, 'Times New Roman', serif; color: #222; line-height: 1.5;">
  <h1>Daily arXiv Digest Failed</h1>
  <p style="color: #666;">Generated at {{ generated_at }}</p>
  <section style="padding: 18px; background: #fff1f0; border: 1px solid #ffccc7; border-radius: 12px;">
    <h2 style="margin-top: 0;">错误信息</h2>
    <pre style="white-space: pre-wrap;">{{ error_message }}</pre>
  </section>
  <p>这通常是 arXiv、Zotero、OpenAI 或 SMTP 的临时问题。GitHub Actions 日志中会有更完整的 traceback。</p>
</body>
</html>
