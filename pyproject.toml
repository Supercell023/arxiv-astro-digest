[project]
name = "daily-arxiv-digest"
version = "0.14.0"
description = "Daily arXiv paper digest with Chinese summaries"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=1.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata>=2025.2",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "openai",
    "dotenv",
    "yaml",
]
ignore_missing_imports = true
